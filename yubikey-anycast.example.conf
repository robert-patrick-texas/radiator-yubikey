# yubikey-anycast.example.conf - Settings for yubikey-anycast.sh. Install it as
# /etc/radiator/anycast.conf, readable by root only (it holds a RADIUS secret):
#
#   sudo install -m 0600 yubikey-anycast.example.conf /etc/radiator/anycast.conf
#
# NAME=value lines; the file is read, never run as shell code.

# The anycast addresses: the same on every Radiator server, one IPv4 and one
# IPv6, in none of your networks. FRR advertises each one while it is on lo.
ADDRESSES="192.0.2.153 2001:db8:153::153"

# The secret of Radiator's <Client 127.0.0.1>, through which the check logs in.
SECRET="local-test-secret"

# Radiator's authentication port.
#PORT=1812

# A check every INTERVAL seconds, each waiting up to TIMEOUT seconds for
# Radiator's answer. The addresses go on lo after RISE good checks in a row,
# and off after FALL failed ones: with these, 10 to 15 s after Radiator stops
# working, and 5 to 10 s after it works again. A shorter INTERVAL uses up the
# check's key sooner: 485 days at 5 s.
#INTERVAL=5
#TIMEOUT=3
#FALL=3
#RISE=2
