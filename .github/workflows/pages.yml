# Publishes yubikey-db-guide.html, the HTML guide that docs/build-guide.sh
# generates from docs/guide.md, as this repository's GitHub Pages site:
# https://robert-patrick-texas.github.io/radiator-yubikey/
# It publishes the committed file as it is: rebuild it with docs/build-guide.sh
# and commit it whenever docs/guide.md changes.
name: Publish the guide

on:
  push:
    branches: [main]
    paths:
      - yubikey-db-guide.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Use the guide as the site's home page
        run: |
          mkdir _site
          cp yubikey-db-guide.html _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
