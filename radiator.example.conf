# radiator.example.conf - Radiator configuration for YubiKey OTP logins, with
# the users and keys in the database that yubikey-db.sh manages (SQLite or
# PostgreSQL). Install it as /etc/radiator/radiator.conf, replacing the sample
# that the Radiator package installs (that sample accepts EVERY login from
# 127.0.0.1, and any client that knows the secret "mysecret"):
#
#   sudo cp -p /etc/radiator/radiator.conf /etc/radiator/radiator.conf.orig
#   sudo install -m 0640 -o root -g radiator radiator.example.conf /etc/radiator/radiator.conf
#
# Then change the <Client> secrets and addresses below. The <AuthBy
# SQLYUBIKEY> clause itself is in /etc/radiator/conf.d/yubikey.conf, written
# by 'yubikey-db.sh config'. Tested with Radiator 4.30 (tests/radiator/run.sh).

LogDir          /var/log/radiator
DbDir           /etc/radiator
LogFile         %L/radiator.log
# 3 logs each login and the reason for a reject. Do not use 4 in production:
# it writes every user's AES key and password hash to the log.
Trace           3
DictionaryFile  /opt/radiator/radiator/dictionary
AuthPort        1812
AcctPort        1813

# With anycast (the guide's "Anycast" section), listen only on 127.0.0.1,
# this server's own addresses and the anycast addresses, so that the reply to
# a request sent to an anycast address comes from that address:
#BindAddress     127.0.0.1, 203.0.113.33, ipv6:2001:db8:33::33, 192.0.2.153, ipv6:2001:db8:153::153

# Run 4 Radiator processes that share the RADIUS ports. Each handles one
# request at a time, so one slow database query (for example while a
# database server fails over) no longer holds up every other login.
# DupCache shared lets them recognize a request retransmitted to another
# process; it needs the Perl module Cache::FastMmap (Ubuntu package
# libcache-fastmmap-perl, which the Radiator package only suggests). Its
# file is about 290 MB (sized for 20,000 requests a second over DupInterval,
# 10 s by default), so it goes in /var/lib/radiator rather than /tmp, which
# may be a tmpfs held in memory. A fixed name means a crash leaves at most
# one file, which the next start reuses.
FarmSize        4
DupCache        shared
DupCacheFile    /var/lib/radiator/dupcache

# The <AuthBy SQLYUBIKEY> clause (Identifier YubiKeyLocal) from
# 'yubikey-db.sh config'.
Include %D/conf.d/yubikey.conf

# This server itself, for tests with radpwtst. Change the secret.
<Client 127.0.0.1>
    Identifier  localhost
    Secret      local-test-secret
</Client>

# One <Client> for each RADIUS client (VPN gateway, switch, wireless
# controller), each with its own long random secret.
<Client 192.0.2.10>
    Identifier  vpn-gateway
    Secret      replace-with-a-long-random-secret
</Client>

# RadSec: RADIUS over TLS (RFC 6614) on TCP port 2083, with TLS 1.2 and 1.3
# and AES-256-GCM only (see "RadSec" in the guide). Logins over RadSec are
# checked like any other. To turn it on, put this server's certificate and
# key and a CA certificate in /etc/radiator/tls, and remove the first # from
# each line from <ServerRADSEC> to </ServerRADSEC>. It listens on the
# BindAddress addresses above, if set. Open TCP 2083 only to your devices.
#<ServerRADSEC>
#    Port                  2083
#    TLS_Protocols         TLSv1.2, TLSv1.3
#    TLS_Ciphers           ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384
#    TLS_Ciphersuites      TLS_AES_256_GCM_SHA384
#    # PEM files: without this line, Radiator reads them as DER and the
#    # listener fails.
#    TLS_CertificateType   PEM
#    TLS_CertificateFile   /etc/radiator/tls/server.crt
#    TLS_PrivateKeyFile    /etc/radiator/tls/server.key
#    # Needed even without client certificates: Radiator asks every client
#    # for one, and doesn't start the listener without a CA file.
#    TLS_CAFile            /etc/radiator/tls/ca.crt
#    # Clients need no certificate, and any certificate they send is
#    # accepted: self-signed, or from any CA. A client that sends another
#    # CA's chain with its certificate is refused: add that CA to TLS_CAFile.
#    TLS_RequireClientCert 0
#    TLS_CertificateVerifyFailedHook sub { return 0; }
#    # For mutual TLS instead (clients must send a certificate that a CA in
#    # TLS_CAFile signed, with a subject this pattern matches), delete the
#    # two lines above and remove the # from this one:
#    #TLS_ExpectedPeerName  ^/CN=nas[0-9]+\.example\.com$
#    # The shared secret is radsec, as RFC 6614 says. If your devices let
#    # you set another, use a long random one:
#    #Secret                replace-with-a-long-random-secret
#</ServerRADSEC>

<AuthLog FILE>
    Identifier     authlog
    Filename       %L/authentication.log
    LogSuccess
    LogFailure
    SuccessFormat  %l user='%u' client='%c' result=OK
    FailureFormat  %l user='%u' client='%c' result=FAIL reason='%1'
</AuthLog>

# The anycast check (yubikey-anycast.sh) logs in every few seconds as
# anycast-HOSTNAME, from this server. Those users may log in only from here
# (the Client with Identifier localhost), the check is told why a login was
# rejected, and its logins are not written to the authentication log.
<Handler User-Name=/^anycast-/, Client-Identifier=localhost>
    Identifier       anycast-check
    AuthBy           YubiKeyLocal
    RejectHasReason
</Handler>

# From any other client, they are rejected.
<Handler User-Name=/^anycast-/>
    Identifier  anycast-elsewhere
    <AuthBy INTERNAL>
        DefaultResult  REJECT
    </AuthBy>
    AuthLog     authlog
</Handler>

# Every other request is checked against the YubiKey database.
<Handler>
    Identifier  yubikey
    AuthBy      YubiKeyLocal
    AuthLog     authlog
</Handler>
