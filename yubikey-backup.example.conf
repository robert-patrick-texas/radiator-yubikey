# yubikey-backup.example.conf - Settings for yubikey-backup.sh. Install it
# as /etc/radiator/backup.conf:
#
#   sudo install -m 0644 yubikey-backup.example.conf /etc/radiator/backup.conf
#
# NAME=value lines; the file is read, never run as shell code.

# The certificate the backups are encrypted to. Its private key is kept off
# this server: see the guide's "Automatic backups".
CERT=/etc/radiator/backup.crt

# How many backups to keep: yubikey-db.cms.0 (the newest) to .6, with one a
# day from yubikey-backup.timer. Keep the private key of every certificate
# used in that time.
#KEEP=7

# Where (mode 0640, group adm: they are encrypted).
#DIR=/var/backups

# The database.
#DATABASE=yubikey
