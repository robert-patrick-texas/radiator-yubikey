# yubikey-partition.example.conf - Settings for yubikey-partition.sh. Install
# it as /etc/radiator/partition.conf:
#
#   sudo install -m 0644 yubikey-partition.example.conf /etc/radiator/partition.conf
#
# NAME=value lines; the file is read, never run as shell code.

# The other two sites' servers (on west: east1 and east2). While none of them
# answers, this server is cut off, and Radiator uses its copy of the keys.
PEERS="east1.example.com east2.example.com"

# A server answers when it accepts a connection on one of these ports:
# PostgreSQL and Patroni's REST API.
#PORTS="5432 8008"

# A check every INTERVAL seconds. Partition mode after ENTER checks in a row
# in which no server answers (10 to 15 s with these); back to normal after
# LEAVE checks in a row in which one answers and the primary can be reached.
#INTERVAL=5
#ENTER=3
#LEAVE=2

# The copy of the keys is updated from this server's PostgreSQL every SYNC
# seconds, and again when partition mode begins. Only a former primary,
# whose PostgreSQL Patroni is stopping then, uses the copy from the last
# SYNC, until its PostgreSQL answers again (about a minute).
#SYNC=300
