# radiator-groups.example.conf - Radiator configuration for logins over
# RADIUS and TACACS+, by YubiKey OTP (people) or by password (service
# accounts, svc.NAME), each checked against groups: which accounts may log in
# to which devices, at which TACACS+ privilege level, with which command rules
# and RADIUS reply attributes. Everything is in the database that
# yubikey-db.sh manages (SQLite or PostgreSQL); see the guide's "Groups and
# TACACS+" section. Install it as /etc/radiator/radiator.conf instead of
# radiator.example.conf, with the dictionary it loads:
#
#   sudo install -m 0644 dictionary.yubikey /etc/radiator/dictionary.yubikey
#   sudo install -m 0640 -o root -g radiator radiator-groups.example.conf /etc/radiator/radiator.conf
#
# The clauses YubiKeyLocal, ServiceAccounts and GroupAccess are in
# /etc/radiator/conf.d/yubikey.conf, written by 'yubikey-db.sh config'. The
# devices are <Client> clauses in /etc/radiator/clients.d/*.conf. Every
# login is rejected until its account is in a group that may use the device
# ('yubikey-db.sh group add', 'member add', 'access set'). Tested with
# Radiator 4.30 (tests/radiator/run.sh DIR groups).

LogDir          /var/log/radiator
DbDir           /etc/radiator
LogFile         %L/radiator.log
# 3 logs each login and the reason for a reject. Do not use 4 in production:
# it writes every user's AES key and password hash to the log.
Trace           3
DictionaryFile  /opt/radiator/radiator/dictionary, %D/dictionary.yubikey
AuthPort        1812
AcctPort        1813

# With anycast, listen only on 127.0.0.1, this server's own addresses and the
# anycast addresses (radiator.example.conf explains why). <ServerTACACSPLUS>
# listens on the same addresses.
#BindAddress     127.0.0.1, 203.0.113.33, ipv6:2001:db8:33::33, 192.0.2.153, ipv6:2001:db8:153::153

# 4 Radiator processes, as in radiator.example.conf.
FarmSize        4
DupCache        shared
DupCacheFile    /var/lib/radiator/dupcache

# YubiKeyLocal, ServiceAccounts and GroupAccess, from 'yubikey-db.sh config'.
Include %D/conf.d/yubikey.conf

# The devices. The Identifier of a device's <Client> clause is its device
# group, which 'yubikey-db.sh access set GROUP DEVICE_GROUP ...' lets groups
# use; several devices may share one. Secret is for RADIUS, TACACSPLUSKey for
# TACACS+; give each device (or subnet) long random ones. For example, in
# /etc/radiator/clients.d/core.conf:
#
#   <Client 192.0.2.10>
#       Identifier     core
#       Secret         replace-with-a-long-random-secret
#       TACACSPLUSKey  replace-with-another-long-random-key
#   </Client>
#   <Client 192.0.2.64/27>
#       Identifier     core
#       Secret         replace-with-a-long-random-secret
#       TACACSPLUSKey  replace-with-another-long-random-key
#   </Client>
#
# A <Client DEFAULT> clause takes every device not listed, in a device group
# of its own (for example Identifier unlisted). Without one, Radiator
# ignores devices that aren't listed.
Include %D/clients.d/*.conf

# This server itself, for tests with radpwtst and the anycast check. Change
# the secret and the key.
<Client 127.0.0.1>
    Identifier     localhost
    Secret         local-test-secret
    TACACSPLUSKey  local-test-key
</Client>

# TACACS+ on port 49, through the same Handlers as RADIUS.
#  - AddToRequest marks its requests with YubiKey-Via (dictionary.yubikey).
#  - The groups decide the privilege level and which commands are allowed
#    (GroupAccess returns the group's name and its rules).
#  - Every authorization (of a session, or of a command) asks the groups in
#    the database again, through the Handler for Service-Type Authorize-Only
#    below (AllowAuthorizeOnly), so it sees them as they are now: a change,
#    or a disabled account, applies to sessions already open. Radiator would
#    otherwise answer from the reply to the login, for AuthorizationTimeout
#    seconds (600 by default), and only in the one of its processes that
#    handled the login: with FarmSize, an authorization that reaches another
#    process would be rejected.
#  - A TACACS+ connection left idle for 5 minutes is closed.
<ServerTACACSPLUS>
    Port                  49
    AddToRequest          YubiKey-Via=tacacs
    AllowAuthorizeOnly
    AuthorizationTimeout  0
    AuthorizeGroupAttr    OSC-Authorize-Group
    GroupMemberAttr       OSC-Group-Identifier
    IdleTimeout           300
</ServerTACACSPLUS>

<AuthLog FILE>
    Identifier     authlog
    Filename       %L/authentication.log
    LogSuccess
    LogFailure
    SuccessFormat  %l user='%u' client='%c' result=OK
    FailureFormat  %l user='%u' client='%c' result=FAIL reason='%1'
</AuthLog>

# TACACS+ accounting (session starts and stops, and commands if the device
# sends them) goes to a file.
<Handler Request-Type=Accounting-Request, YubiKey-Via=tacacs>
    Identifier       tacacs-accounting
    AcctLogFileName  %L/tacacs-accounting.log
    <AuthBy INTERNAL>
        DefaultResult  ACCEPT
    </AuthBy>
</Handler>

# A TACACS+ authorization: only the groups are asked. Radiator 4.30 answers a REJECTED request here with
# the wrong kind of TACACS+ packet, which a device takes for an error (and
# may then try its local accounts, or allow the command). So it never
# rejects: without a group, it accepts with the one rule "deny everything",
# which Radiator turns into a proper authorization failure. If the database
# can't be reached, GroupAccess ignores the request, and the device gets an
# error.
<Handler Service-Type=Authorize-Only, YubiKey-Via=tacacs>
    Identifier    tacacs-authorize-only
    AuthByPolicy  ContinueWhileReject
    AuthBy        GroupAccess
    <AuthBy INTERNAL>
        Identifier     NoAccess
        DefaultResult  ACCEPT
        AddToReply     OSC-Group-Identifier=no-access, OSC-Authorize-Group="deny .*"
    </AuthBy>
</Handler>

# Authorize-Only from anywhere else (a RADIUS client) is rejected.
<Handler Service-Type=Authorize-Only>
    Identifier  authorize-only-elsewhere
    <AuthBy INTERNAL>
        DefaultResult  REJECT
    </AuthBy>
</Handler>

# The anycast check (yubikey-anycast.sh), as in radiator.example.conf: from
# this server only, with no group check.
<Handler User-Name=/^anycast-/, Client-Identifier=localhost>
    Identifier       anycast-check
    AuthBy           YubiKeyLocal
    RejectHasReason
</Handler>

<Handler User-Name=/^anycast-/>
    Identifier  anycast-elsewhere
    <AuthBy INTERNAL>
        DefaultResult  REJECT
    </AuthBy>
    AuthLog     authlog
</Handler>

# Service accounts: their password, then the groups.
<Handler User-Name=/^svc\./>
    Identifier    service-accounts
    AuthByPolicy  ContinueWhileAccept
    AuthBy        ServiceAccounts
    AuthBy        GroupAccess
    AuthLog       authlog
</Handler>

# Everyone else: the YubiKey database, then the groups.
<Handler>
    Identifier    yubikey
    AuthByPolicy  ContinueWhileAccept
    AuthBy        YubiKeyLocal
    AuthBy        GroupAccess
    AuthLog       authlog
</Handler>
